[project]
name = "central-universal"
version = "0.1.0"
description = "Central Universal de Aprendizagem - V0.1 (local-first, monolito modular)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "starlette==0.41.3",
    "uvicorn>=0.30",
    "fsrs>=6.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["central_universal*"]
